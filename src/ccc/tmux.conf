# ccc's own tmux configuration (#335, #336), loaded by both ccc servers
# ("ccc" = the TUI, "ccc-sessions" = the conversations) instead of the
# user's tmux.conf: `tmux -f <this file>` (src/ccc/tmux.py, bin/ccc-tui-supervise.sh).
# Without it ccc ran on tmux's bare defaults, so what worked depended on the
# system: a fresh OS has history-limit 2000, mouse off, and a terminal
# without the clipboard capability gets no copy at all.
#
# Everything here is idempotent (ccc also `source-file`s it into a server
# that was already running), so no `set -a`, only indexed terminal-features.
# Settings that belong to one server only (prefix, detach key, bindings,
# pane borders) stay in managed_sessions / tui.cli_pane.

# The wheel scrolls (and a click switches pane) in every layer.
set -g mouse on
# Scroll back through a long conversation, not just the last 2000 lines.
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -s extended-keys on

# Copying: only tmux's own copies go to the clipboard (OSC 52) — never an
# escape sequence merely printed into a pane (see tui.cli_pane, clipboard_bridge).
set -s set-clipboard external
# Tell tmux every outer terminal can take OSC 52 and truecolor, even when
# its terminfo doesn't say so (alacritty, foot, Termux, ...). Fixed indexes,
# so loading the file again doesn't add a copy.
set -s terminal-features[90] "*:clipboard:extkeys"
set -s terminal-features[91] "*:RGB"
